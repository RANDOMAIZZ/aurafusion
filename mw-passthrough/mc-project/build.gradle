plugins { id "fabric-loom" version "${loom_version}" }
version = project.mod_version
group = "dev.mw"

repositories { mavenCentral() }

loom { splitEnvironmentSourceSets(); mods { create("mw-passthrough") { sourceSet sourceSets.main } } }

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  mappings "net.fabricmc:yarn:${project.minecraft_version}+build.3:v2"
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
  // без fabric-api: рантайм уже лежит в mods, хук тика через Mixin
  implementation "org.java-websocket:Java-WebSocket:1.5.6"
  include "org.java-websocket:Java-WebSocket:1.5.6"
}

java { withSourcesJar(); toolchain { languageVersion.set(JavaLanguageVersion.of(21)) } }
tasks.withType(JavaCompile).configureEach { options.release.set(21) }
