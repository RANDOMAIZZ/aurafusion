name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Логика ядра (конфиг, темп, цвет, журнал, режимы OpenRGB) от Windows не
    # зависит; оверлей, звук и BLE в CI не проверяются — им нужно железо.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Зависимости
        run: python -m pip install numpy Pillow pytest pyflakes
      - name: pyflakes (неопределённые имена)
        run: |
          python -m pyflakes core ui web_main.py tests | grep -E "undefined name|redefinition" && exit 1 || true
      - name: pytest
        run: python -m pytest -q
